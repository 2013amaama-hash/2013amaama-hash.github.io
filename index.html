<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Help — ИИ-помощник</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; text-align: center; padding: 40px 20px; margin: 0; }
    h1 { color: #38bdf8; font-size: 32px; }
    p { font-size: 18px; line-height: 1.6; max-width: 500px; margin: 20px auto; }

    .card { background: #1e293b; border-radius: 16px; padding: 30px 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    footer { margin-top: 40px; font-size: 14px; color: #64748b; }

</head>
<body>
  <div class="card">
    <h1>Smart Help</h1>
    <p>Привет! Это мой первый сайт с ИИ-помощником. Скоро здесь появится умный помощник, который будет объяснять сложные темы, подсказывать идеи для проектов и помогать готовиться к контрольным.</p>
    <button onclick="alert('Привет! Я пока только кнопка, но скоро стану умным ИИ-помощником :)')">Попробовать</button>
